# Copied into the broker's etc/ directory by the image entrypoint (see the etc-override mount in
# compose-backends.yml). Overrides the matching value in broker.xml.
#
# Artemis blocks all message production once the filesystem holding its journal passes
# max-disk-usage, which the image ships at 90. On a developer machine that limit belongs to the
# Docker VM's virtual disk, shared by every container, and it is routinely crossed. When it is,
# sends to camelbee-southhbound-queue hang indefinitely - the sample's pipeline stalls at
# enrich("direct:invokeJms") with no error, and the file consumer stops deleting files, which looks
# like a bug in the sample rather than a full disk. Raise the limit so the demo keeps running.
#
# This is a demo convenience, not a production setting: a broker that fills its disk completely
# cannot recover cleanly. Keep some headroom rather than disabling the check with -1.
maxDiskUsage=99
