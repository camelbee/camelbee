spring.application.name = core-only-springboot-sample

camelbee.context-enabled = true
camelbee.notifier-enabled = true
camelbee.tracer-enabled = true
# Sample only: leaves the UI and API unauthenticated so it can be opened without credentials.
# CamelBee defaults this to TRUE - a real deployment should leave it on and set camelbee.password.
camelbee.auth-enabled = false
