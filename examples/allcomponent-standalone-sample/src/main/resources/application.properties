camel.main.name = camelbee-standalone-sample

# embedded platform-http server (camel-platform-http-main, brought by the starter)
camel.server.enabled = true
camel.server.host = 0.0.0.0
camel.server.port = 8080

# Base URL the http producer calls back on. Kept as a property (rather than inlined in the route)
# so the topology exercises CamelBee's {{...}} placeholder resolution, and so an integration test
# can point it at an ephemeral port.
camelbee.sample.self-url = http://localhost:8080

# Traffic generator cadence. Raised to a very large value by the UI end-to-end tests so background
# exchanges cannot land in the middle of an assertion.
camelbee.sample.timer-period = 10000
camelbee.sample.timer-delay = 5000

# CamelBee
camelbee.context-enabled = true
camelbee.notifier-enabled = true
camelbee.tracer-enabled = true
# Sample only: the UI and API are left unauthenticated so the sample can be opened without
# credentials and so the end-to-end suite can drive the API directly. CamelBee defaults this to
# TRUE - a real deployment should leave it on and set camelbee.password (or CAMELBEE_PASSWORD).
camelbee.auth-enabled = false


# Redaction. Applied at capture, so a redacted value never reaches the UI, the REST API or the log.
# masking-enabled is the one camelbee.* switch that defaults to ON - the others fail closed by
# staying off, this one fails closed by staying on.
camelbee.masking-enabled = true
# Comma-separated key names to redact. Leave unset to keep the built-in list:
#   password, passwd, secret, token, authorization, auth, apikey, accesskey, privatekey,
#   credential, creditcard, cardnumber, cardno, cvv, cvc, iban, ssn, pin, otp
# Setting it REPLACES that list entirely, so an entry left out is no longer redacted.
#camelbee.masked-keys = password,token,authorization,apikey,creditcard,cvv,iban,ssn,customerRef
# When disabled, no message body text is captured at all - the only hard guarantee, since body
# redaction is best-effort pattern matching. Does not affect headers.
camelbee.tracer-body-enabled = true
