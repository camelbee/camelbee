camel.main.name = camelbee-standalone-sample

# embedded platform-http server (camel-platform-http-main, brought by the starter)
camel.server.enabled = true
camel.server.host = 0.0.0.0
camel.server.port = 8080

# Base URL the http producer calls back on. Kept as a property (rather than inlined in the route)
# so the topology exercises CamelBee's {{...}} placeholder resolution, and so an integration test
# can point it at an ephemeral port.
camelbee.sample.self-url = http://localhost:8080

# Traffic generator cadence. Raised to a very large value by the UI end-to-end tests so background
# exchanges cannot land in the middle of an assertion.
camelbee.sample.timer-period = 10000
camelbee.sample.timer-delay = 5000

# CamelBee
camelbee.context-enabled = true
camelbee.notifier-enabled = true
camelbee.tracer-enabled = true
