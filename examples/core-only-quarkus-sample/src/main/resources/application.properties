quarkus.application.name = core-only-quarkus-sample

camelbee.context-enabled = true
camelbee.notifier-enabled = true
camelbee.tracer-enabled = true
# Sample only: leaves the UI and API unauthenticated so it can be opened without credentials.
# CamelBee defaults this to TRUE - a real deployment should leave it on and set camelbee.password.
camelbee.auth-enabled = false

# camelbee-quarkus-core ships its own Jandex index, so it needs no index-dependency entry. Its
# engine dependency does not, so name it here or the shared beans are never discovered.
quarkus.index-dependency.camelbeecore.group-id = io.camelbee
quarkus.index-dependency.camelbeecore.artifact-id = camelbee-core

# keep the timer from injecting exchanges while assertions run
coreonly.timer-delay = 3600000
